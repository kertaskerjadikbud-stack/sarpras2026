<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Admin Sarpras Sekolah</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6">

<div class="max-w-6xl mx-auto">

  <!-- HEADER -->
  <div class="bg-white p-6 rounded shadow mb-6 flex justify-between items-center">
    <h1 class="text-2xl font-bold">📊 Dashboard Admin Sarpras</h1>
    <button onclick="exportExcel()" class="btn btn-success">
      📥 Export Excel
    </button>
  </div>

  <!-- RESET SEKOLAH -->
  <div class="bg-white p-6 rounded shadow mb-6">
    <h2 class="text-lg font-semibold mb-3">🔓 Reset Data Sekolah</h2>

    <div class="row g-3">
      <div class="col-md-8">
        <input id="resetNpsn" class="form-control" placeholder="Masukkan NPSN Sekolah">
      </div>
      <div class="col-md-4">
        <button onclick="resetSekolah()" class="btn btn-danger w-full">
          Reset Data
        </button>
      </div>
    </div>
  </div>

  <!-- GRAFIK -->
  <div class="bg-white p-6 rounded shadow mb-6">
    <h2 class="text-lg font-semibold mb-4">📈 Rekap Per Kecamatan</h2>
    <canvas id="chartKecamatan" height="120"></canvas>
  </div>

  <!-- TABEL -->
  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-lg font-semibold mb-3">📋 Data Rekap</h2>

    <table class="table table-bordered">
      <thead class="table-light">
        <tr>
          <th>Kecamatan</th>
          <th>Jumlah Sekolah</th>
          <th>Total Siswa</th>
        </tr>
      </thead>
      <tbody id="tableData"></tbody>
    </table>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxvH5sAP4pVx4G18QQMoNFw2lQRqFD5bwS5W8biYioOt3mmi5mUJRP2e5mKosXh3TxNDA/exec';

/* ================= LOAD DATA ================= */
let chart;

fetch(API_URL, {
  method: 'POST',
  body: new URLSearchParams({ action: 'rekapKecamatan' })
})
.then(r => r.json())
.then(res => {
  if (res.status === 'ok') {
    renderTable(res.data);
    renderChart(res.data);
  }
});

/* ================= TABEL ================= */
function renderTable(data) {
  const tbody = document.getElementById('tableData');
  tbody.innerHTML = '';

  Object.keys(data).forEach(kec => {
    tbody.innerHTML += `
      <tr>
        <td>${kec}</td>
        <td>${data[kec].sekolah}</td>
        <td>${data[kec].siswa}</td>
      </tr>
    `;
  });
}

/* ================= CHART ================= */
function renderChart(data) {
  const labels = Object.keys(data);
  const siswa = labels.map(k => data[k].siswa);

  const ctx = document.getElementById('chartKecamatan');

  if (chart) chart.destroy();

  chart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Jumlah Siswa',
        data: siswa,
        backgroundColor: 'rgba(59,130,246,0.7)'
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false }
      }
    }
  });
}

/* ================= RESET ================= */
function resetSekolah() {
  const npsn = document.getElementById('resetNpsn').value.trim();
  if (!npsn) return alert('NPSN wajib diisi');

  if (!confirm('Yakin reset data sekolah ini?')) return;

  fetch(API_URL, {
    method: 'POST',
    body: new URLSearchParams({
      action: 'adminReset',
      npsn
    })
  })
  .then(r => r.json())
  .then(res => {
    alert(res.message);
    location.reload();
  });
}

/* ================= EXPORT ================= */
function exportExcel() {
  fetch(API_URL, {
    method: 'POST',
    body: new URLSearchParams({ action: 'exportExcel' })
  })
  .then(r => r.json())
  .then(res => {
    window.open(res.url, '_blank');
  });
}
</script>

</body>
</html>
