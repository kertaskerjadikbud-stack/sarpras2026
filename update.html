<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Sarpras 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f7fafc }
.required::after { content:" *"; color:red }
</style>
</head>
<body class="p-4">

<div class="container">
  <div class="card shadow">
    <div class="card-body">
      <h5 class="fw-bold mb-3 text-center">
        INPUT DATA SARANA PRASARANA 2026
      </h5>

      <form id="kk-form" class="row g-3">

        <!-- NPSN & Sekolah -->
        <div class="col-md-6">
          <label class="form-label required">NPSN</label>
          <input type="text" name="NPSN" id="npsn" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">NAMA SEKOLAH</label>
          <input type="text" id="namaSekolah" class="form-control" readonly>
        </div>

        <div class="col-md-6">
          <label class="form-label">ALAMAT</label>
          <input type="text" id="alamat" class="form-control" readonly>
        </div>

        <div class="col-md-6">
          <label class="form-label">KECAMATAN</label>
          <input type="text" id="kecamatan" class="form-control" readonly>
        </div>

        <!-- Input manual -->
        <div class="col-md-4">
          <label class="form-label required">JUMLAH SISWA</label>
          <input type="number" name="JUMLAH SISWA" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label required">JUMLAH ROMBEL</label>
          <input type="number" name="JUMLAH ROMBEL" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label required">KEBUTUHAN KURSI SISWA</label>
          <input type="number" name="KEBUTUHAN KURSI SISWA" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label required">KEBUTUHAN MEJA SISWA</label>
          <input type="number" name="KEBUTUHAN MEJA SISWA" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label required">KEBUTUHAN KURSI GURU</label>
          <input type="number" name="KEBUTUHAN KURSI GURU" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label class="form-label required">KEBUTUHAN MEJA GURU</label>
          <input type="number" name="KEBUTUHAN MEJA GURU" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label required">KEBUTUHAN PAPAN INFORMASI</label>
          <input type="number" name="KEBUTUHAN PAPAN INFORMASI" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label required">KEBUTUHAN LEMARI ARSIP</label>
          <input type="number" name="KEBUTUHAN LEMARI ARSIP" class="form-control" required>
        </div>

        <!-- Upload file -->
        <div class="col-12">
          <label class="form-label required">BUKTI DUKUNG (PDF/JPG/PNG)</label>
          <input type="file" id="buktiFile" accept=".pdf,.jpg,.jpeg,.png" class="form-control" required>
          <small class="text-muted">Maksimal 5 MB</small>
        </div>

        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Kirim</button>
          <button class="btn btn-secondary" type="reset">Reset</button>
        </div>
      </form>

      <div id="status" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzV-uo6JIpM-tqToyrlb0FoPeg7nWyFXhuJ_wWU2p89bKympcS6Z5Punu_rdcYoRloUnw/exec"; // Ganti dengan URL Web App Apps Script
const form = document.getElementById("kk-form");
const statusEl = document.getElementById("status");
const npsnInput = document.getElementById("npsn");

/* Load data otomatis dari NPSN */
npsnInput.addEventListener("blur", async () => {
  const npsn = npsnInput.value.trim();
  if(!npsn) return;
  const res = await fetch(`${SCRIPT_URL}?getSekolah=${npsn}`);
  const json = await res.json();
  if(json.found){
    document.getElementById("namaSekolah").value = json.nama;
    document.getElementById("alamat").value = json.alamat;
    document.getElementById("kecamatan").value = json.kecamatan;
  } else {
    alert("NPSN tidak ditemukan");
    form.reset();
  }
});

/* Submit data */
form.addEventListener("submit", async e=>{
  e.preventDefault();
  if(!confirm("Kirim data sekarang?")) return;

  const fileInput = document.getElementById("buktiFile");
  const file = fileInput.files[0];
  if(!file) return alert("File wajib diunggah");

  if(file.size > 5*1024*1024) return alert("File maksimal 5 MB");
  const allowed = ["application/pdf","image/jpeg","image/png"];
  if(!allowed.includes(file.type)) return alert("Format file harus PDF/JPG/PNG");

  const npsn = npsnInput.value.trim();
  const nama = document.getElementById("namaSekolah").value.trim();
  const safeNama = nama.replace(/[^a-zA-Z0-9]/g,"_");
  const ext = file.name.split(".").pop();
  const fileName = `${npsn}_${safeNama}.${ext}`;

  const formData = new FormData(form);
  formData.append("fileName", fileName);
  formData.append("namaSekolah", nama);
  formData.append("file", file);

  statusEl.innerHTML = '⏳ Mengirim data...';

  try{
    const res = await fetch(SCRIPT_URL, {method:"POST", body: formData});
    const json = await res.json();
    if(json.success){
      statusEl.innerHTML = '✅ Data berhasil dikirim';
      // Disable form agar tidak bisa kirim lagi
      form.querySelectorAll("input, button").forEach(el=>el.disabled=true);
    } else {
      statusEl.innerHTML = `❌ ${json.message}`;
    }
  } catch(err){
    statusEl.innerHTML = '❌ Gagal mengirim data';
  }
});
</script>

</body>
</html>
