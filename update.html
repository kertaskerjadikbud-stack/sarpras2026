<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Sarpras 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#f7fafc }
  .required::after { content:" *"; color:red }
  #preview { max-height:200px; margin-top:10px; }
</style>
</head>
<body class="p-4">

<div class="container">
  <div class="card shadow">
    <div class="card-body">
      <h5 class="fw-bold mb-3 text-center">INPUT DATA SARANA PRASARANA 2026</h5>
      <form id="kk-form" class="row g-3">
        <div class="col-md-6">
          <label class="form-label required">NPSN</label>
          <input type="text" name="NPSN" id="npsn" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">NAMA SEKOLAH</label>
          <input type="text" id="namaSekolah" class="form-control" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label">ALAMAT</label>
          <input type="text" id="alamat" class="form-control" readonly>
        </div>
        <div class="col-md-6">
          <label class="form-label">KECAMATAN</label>
          <input type="text" id="kecamatan" class="form-control" readonly>
        </div>

        <!-- Manual input -->
        <div class="col-md-4"><label class="form-label required">JUMLAH SISWA</label><input type="number" name="JUMLAH SISWA" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label required">JUMLAH ROMBEL</label><input type="number" name="JUMLAH ROMBEL" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label required">KEBUTUHAN KURSI SISWA</label><input type="number" name="KEBUTUHAN KURSI SISWA" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label required">KEBUTUHAN MEJA SISWA</label><input type="number" name="KEBUTUHAN MEJA SISWA" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label required">KEBUTUHAN KURSI GURU</label><input type="number" name="KEBUTUHAN KURSI GURU" class="form-control" required></div>
        <div class="col-md-4"><label class="form-label required">KEBUTUHAN MEJA GURU</label><input type="number" name="KEBUTUHAN MEJA GURU" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label required">KEBUTUHAN PAPAN INFORMASI</label><input type="number" name="KEBUTUHAN PAPAN INFORMASI" class="form-control" required></div>
        <div class="col-md-6"><label class="form-label required">KEBUTUHAN LEMARI ARSIP</label><input type="number" name="KEBUTUHAN LEMARI ARSIP" class="form-control" required></div>

        <!-- File -->
        <div class="col-12">
          <label class="form-label required">BUKTI DUKUNG (PDF/JPG/PNG)</label>
          <input type="file" id="buktiFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required>
          <div id="preview"></div>
        </div>

        <div class="col-12 d-flex gap-2">
          <button class="btn btn-primary" type="submit">Kirim</button>
          <button class="btn btn-secondary" type="reset">Reset</button>
        </div>
      </form>
      <div id="status" class="mt-3"></div>
    </div>
  </div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_E3yABF4YD9udF4PitNsOt3eQjGnkUN8kl8FGXfoMm113tL77Q-YkKDyA3AK1BkCM/exec"; // Ganti dengan Web App URL
const form = document.getElementById("kk-form");
const statusEl = document.getElementById("status");
const npsnInput = document.getElementById("npsn");
const previewEl = document.getElementById("preview");

let submitted = false; // Cegah submit ganda

// Load data sekolah
npsnInput.addEventListener("blur", async () => {
  const npsn = npsnInput.value.trim();
  if (!npsn) return;
  const res = await fetch(`${SCRIPT_URL}?getSekolah=${npsn}`);
  const json = await res.json();
  if (!json.found) {
    alert("NPSN tidak ditemukan di database");
    form.reset();
    return;
  }
  document.getElementById("namaSekolah").value = json.nama;
  document.getElementById("alamat").value = json.alamat;
  document.getElementById("kecamatan").value = json.kecamatan;
});

// Preview file
document.getElementById("buktiFile").addEventListener("change", (e)=>{
  const file = e.target.files[0];
  if(!file) return previewEl.innerHTML = "";
  const ext = file.name.split(".").pop().toLowerCase();
  if(["pdf","jpg","jpeg","png"].includes(ext)){
    if(ext=="pdf"){
      previewEl.innerHTML = `<p>Preview PDF: ${file.name}</p>`;
    } else {
      const url = URL.createObjectURL(file);
      previewEl.innerHTML = `<img src="${url}" id="preview" class="img-fluid border">`;
    }
  } else {
    alert("Format file hanya PDF/JPG/PNG");
    e.target.value = "";
    previewEl.innerHTML = "";
  }
});

// Submit data
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(submitted) return alert("Data sudah dikirim");

  if(!confirm("Kirim data sekarang?")) return;

  const file = document.getElementById("buktiFile").files[0];
  if(!file) return alert("File wajib diupload");

  if(file.size>5*1024*1024) return alert("File maksimal 5 MB");

  const npsn = form.NPSN.value.trim();
  const nama = form["NAMA SEKOLAH"].value.trim();
  const safeNama = nama.replace(/[^a-zA-Z0-9]/g,"_");
  const ext = file.name.split(".").pop();
  const fileName = `${npsn}_${safeNama}.${ext}`;

  statusEl.innerHTML = "⏳ Mengirim data...";

  const reader = new FileReader();
  reader.onload = async ()=>{
    const payload = {...Object.fromEntries(new FormData(form).entries()),
                     fileName, fileType: file.type, fileBase64: reader.result};
    try{
      const res = await fetch(SCRIPT_URL,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ payload })
      });
      const json = await res.json();
      if(json.success){
        statusEl.innerHTML = "✅ Data berhasil disimpan";
        submitted = true;
      } else {
        statusEl.innerHTML = `❌ Terjadi kesalahan: ${json.message}`;
      }
    }catch(err){
      statusEl.innerHTML = `❌ Terjadi kesalahan: ${err.message}`;
    }
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
