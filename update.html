<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form Input Data Sekolah</title>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body { background-color: #f0f4f8; }
.form-container { background:#fff; padding:2rem; border-radius:1rem; max-width:800px; margin:2rem auto; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
h2 { font-weight:700; margin-bottom:1rem; color:#1e3a8a;}
.btn-submit { background-color: #1e3a8a; color:#fff; }
.btn-submit:hover { background-color: #3b82f6; color:#fff; }
</style>
</head>
<body class="font-sans">

<div class="form-container">
  <h2 class="text-center">Form Input Data Sekolah</h2>

  <div class="mb-3">
    <label for="npsn" class="form-label">NPSN</label>
    <input type="text" id="npsn" class="form-control" placeholder="Masukkan NPSN" onchange="getSchoolData()">
  </div>

  <div id="schoolInfo" class="mb-4 p-3 border rounded bg-gray-100 text-gray-700"></div>

  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Jumlah Siswa</label><input type="number" id="jumlahSiswa" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Rombel</label><input type="number" id="jumlahRombel" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Kebutuhan Kursi</label><input type="number" id="jumlahKursi" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Kebutuhan Meja</label><input type="number" id="jumlahMeja" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Meja Guru</label><input type="number" id="jumlahMejaGuru" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Kursi Guru</label><input type="number" id="jumlahKursiGuru" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Papan Informasi</label><input type="number" id="jumlahPapan" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Jumlah Lemari Arsip</label><input type="number" id="jumlahLemari" class="form-control" required></div>
  </div>

  <div class="mb-3 mt-3">
    <label class="form-label">Dokumen Pendukung</label>
    <input type="file" id="dokumen" class="form-control">
  </div>

  <div class="text-center">
    <button class="btn btn-submit btn-lg" onclick="submitData()">Submit</button>
  </div>

  <div id="statusMsg" class="mt-3 text-center text-red-600"></div>
</div>

<script>
// Ganti dengan URL Web App Anda
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwvkTsuxlvTB-o-GkLmiWd_BumI-Ukzwxjxn1yghqdnYMS27tBxVDhNqTy_fMId5ESzNg/exec";

// Ambil data sekolah berdasarkan NPSN
async function getSchoolData() {
  const npsn = document.getElementById('npsn').value;
  if(!npsn) return;

  try {
    const res = await fetch(`${WEB_APP_URL}?action=getSchool&npsn=${encodeURIComponent(npsn)}`);
    if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const data = await res.json();
    if(data.found){
      document.getElementById('schoolInfo').innerHTML =
        `<strong>Nama Sekolah:</strong> ${data.nama}<br>` +
        `<strong>Alamat:</strong> ${data.alamat}<br>` +
        `<strong>Kecamatan:</strong> ${data.kecamatan}`;
    } else {
      document.getElementById('schoolInfo').innerHTML = "Data tidak ditemukan";
    }
  } catch(err) {
    console.error("Fetch error:", err);
    document.getElementById('statusMsg').innerText = "Gagal mengambil data sekolah. Periksa Web App URL dan akses publik.";
  }
}

// Convert file ke Base64
function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = ()=>resolve({content:reader.result.split(',')[1], name:file.name, mimeType:file.type});
    reader.onerror = err=>reject(err);
  });
}

// Submit data
async function submitData(){
  const statusEl = document.getElementById('statusMsg');
  statusEl.innerText = "";
  const npsn = document.getElementById('npsn').value;
  if(!npsn){ alert("NPSN wajib diisi!"); return; }

  let fileObj = null;
  const fileInput = document.getElementById('dokumen');
  if(fileInput.files.length>0){
    try { fileObj = await fileToBase64(fileInput.files[0]); } 
    catch(err){ statusEl.innerText="Gagal membaca file"; return; }
  }

  const payload = {
    data:{
      npsn,
      jumlahSiswa: document.getElementById('jumlahSiswa').value,
      jumlahRombel: document.getElementById('jumlahRombel').value,
      jumlahKursi: document.getElementById('jumlahKursi').value,
      jumlahMeja: document.getElementById('jumlahMeja').value,
      jumlahMejaGuru: document.getElementById('jumlahMejaGuru').value,
      jumlahKursiGuru: document.getElementById('jumlahKursiGuru').value,
      jumlahPapan: document.getElementById('jumlahPapan').value,
      jumlahLemari: document.getElementById('jumlahLemari').value
    },
    file:fileObj
  };

  try{
    const res = await fetch(WEB_APP_URL,{
      method:"POST",
      body: JSON.stringify(payload),
      headers: {"Content-Type":"application/json"}
    });
    if(!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
    const msg = await res.text();
    alert(msg);
  } catch(err){
    console.error("Submit error:", err);
    statusEl.innerText = "Gagal submit data. Pastikan Web App sudah di-deploy publik.";
  }
}
</script>

</body>
</html>
