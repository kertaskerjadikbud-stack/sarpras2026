<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Input Sarpras 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { background:#f7fafc }
.required::after { content:" *"; color:red }
#uploadedFileName { font-weight:bold; margin-top:5px; }
#filePreview { margin-top:10px; max-width:100%; max-height:400px; border:1px solid #ddd; padding:5px; }
</style>
</head>
<body class="p-4">

<div class="container">
<div class="card shadow">
<div class="card-body">

<h5 class="fw-bold mb-3 text-center">INPUT DATA SARANA PRASARANA 2026</h5>

<form id="kk-form" class="row g-3">
  <div class="col-md-6">
    <label class="form-label required">NPSN</label>
    <input type="text" name="NPSN" id="npsn" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label">NAMA SEKOLAH</label>
    <input type="text" name="NAMA SEKOLAH" id="namaSekolah" class="form-control" readonly>
  </div>
  <div class="col-md-6">
    <label class="form-label">ALAMAT</label>
    <input type="text" name="ALAMAT" id="alamat" class="form-control" readonly>
  </div>
  <div class="col-md-6">
    <label class="form-label">KECAMATAN</label>
    <input type="text" name="KECAMATAN" id="kecamatan" class="form-control" readonly>
  </div>

  <!-- Manual Inputs -->
  <div class="col-md-4">
    <label class="form-label required">JUMLAH SISWA</label>
    <input type="number" name="JUMLAH SISWA" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label required">JUMLAH ROMBEL</label>
    <input type="number" name="JUMLAH ROMBEL" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label required">KEBUTUHAN KURSI SISWA</label>
    <input type="number" name="KEBUTUHAN KURSI SISWA" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label required">KEBUTUHAN MEJA SISWA</label>
    <input type="number" name="KEBUTUHAN MEJA SISWA" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label required">KEBUTUHAN KURSI GURU</label>
    <input type="number" name="KEBUTUHAN KURSI GURU" class="form-control" required>
  </div>
  <div class="col-md-4">
    <label class="form-label required">KEBUTUHAN MEJA GURU</label>
    <input type="number" name="KEBUTUHAN MEJA GURU" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label required">KEBUTUHAN PAPAN INFORMASI</label>
    <input type="number" name="KEBUTUHAN PAPAN INFORMASI" class="form-control" required>
  </div>
  <div class="col-md-6">
    <label class="form-label required">KEBUTUHAN LEMARI ARSIP</label>
    <input type="number" name="KEBUTUHAN LEMARI ARSIP" class="form-control" required>
  </div>

  <!-- File Upload -->
  <div class="col-12">
    <label class="form-label required">BUKTI DUKUNG (PDF/JPG/PNG)</label>
    <input type="file" id="buktiFile" class="form-control" accept=".pdf,.jpg,.jpeg,.png" required>
    <div id="uploadedFileName"></div>
    <div id="filePreview"></div>
  </div>

  <div class="col-12 d-flex gap-2">
    <button class="btn btn-primary" type="submit">Simpan</button>
    <button class="btn btn-secondary" type="reset">Reset</button>
  </div>
</form>

<div id="status" class="mt-3"></div>

</div>
</div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzp18IGyZBSoAId7RlX-4C0UZp0QpXUfoRXLr-bRPT0FfPp4-CS_BW2ug5JgbGGhY41TA/exec";

const form = document.getElementById("kk-form");
const statusEl = document.getElementById("status");
const npsnInput = document.getElementById("npsn");
const fileInput = document.getElementById("buktiFile");
const uploadedFileNameEl = document.getElementById("uploadedFileName");
const filePreviewEl = document.getElementById("filePreview");
let uploadedFileName = "";
let uploadedFileUrl = "";

/* LOAD DATA SEKOLAH */
npsnInput.addEventListener("blur", async () => {
  const npsn = npsnInput.value.trim();
  if(!npsn) return;
  try{
    statusEl.innerHTML = '⏳ Mengecek NPSN...';
    const res = await fetch(`${SCRIPT_URL}?getSekolah=${npsn}`);
    const json = await res.json();
    if(!json.found){
      alert("NPSN tidak ditemukan");
      form.reset();
      statusEl.innerHTML = "";
      return;
    }
    document.getElementById("namaSekolah").value = json.nama;
    document.getElementById("alamat").value = json.alamat;
    document.getElementById("kecamatan").value = json.kecamatan;
    statusEl.innerHTML = "";
  } catch(err){
    statusEl.innerHTML = "❌ Gagal load data";
  }
});

/* UPLOAD FILE DAN PREVIEW */
fileInput.addEventListener("change", async () => {
  const file = fileInput.files[0];
  if(!file) return;
  const allowed = ["application/pdf","image/jpeg","image/png"];
  if(!allowed.includes(file.type)){
    alert("Format file harus PDF/JPG/PNG");
    fileInput.value = "";
    return;
  }
  if(file.size > 5*1024*1024){
    alert("Ukuran maksimal 5 MB");
    fileInput.value = "";
    return;
  }

  const npsn = form.NPSN.value.trim();
  const nama = form["NAMA SEKOLAH"].value.trim();
  const ext = file.name.split(".").pop();
  const safeNama = nama.replace(/[^a-zA-Z0-9]/g,"_");
  const fileName = `${npsn}_${safeNama}.${ext}`;

  statusEl.innerHTML = '⏳ Mengupload file...';

  const reader = new FileReader();
  reader.onload = async () => {
    const payload = {fileName, fileType:file.type, fileBase64:reader.result, NPSN:npsn, "NAMA SEKOLAH":nama, ALAMAT:form.ALAMAT.value, KECAMATAN:form.KECAMATAN.value};
    try{
      const res = await fetch(SCRIPT_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({payload})
      });
      const json = await res.json();
      if(json.success){
        uploadedFileName = json.fileName;
        uploadedFileUrl = json.fileUrl;
        uploadedFileNameEl.innerText = `File berhasil diupload: ${uploadedFileName}`;

        // Preview
        if(file.type=="application/pdf"){
          filePreviewEl.innerHTML = `<iframe src="${uploadedFileUrl}" width="100%" height="400px"></iframe>`;
        } else {
          filePreviewEl.innerHTML = `<img src="${uploadedFileUrl}" alt="Preview" style="max-width:100%; max-height:400px;">`;
        }

        statusEl.innerHTML = '✅ File berhasil diupload';
      } else {
        statusEl.innerHTML = `❌ Gagal upload: ${json.message}`;
      }
    } catch(err){
      statusEl.innerHTML = `❌ Terjadi kesalahan: ${err.message}`;
    }
  };
  reader.readAsDataURL(file);
});

/* SUBMIT FORM */
form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  if(!confirm("Apakah Anda yakin ingin mengirim data?")) return;
  if(!uploadedFileName){
    alert("File belum diupload!");
    return;
  }

  statusEl.innerHTML = '⏳ Menyimpan data...';
  try{
    const payload = {...Object.fromEntries(new FormData(form).entries()), fileName:uploadedFileName};
    const res = await fetch(SCRIPT_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({payload})
    });
    const json = await res.json();
    if(json.success){
      statusEl.innerHTML = '✅ Data berhasil dikirim';
      form.reset();
      uploadedFileName = "";
      uploadedFileUrl = "";
      uploadedFileNameEl.innerText = "";
      filePreviewEl.innerHTML = "";
    } else {
      statusEl.innerHTML = `❌ Terjadi kesalahan: ${json.message}`;
    }
  } catch(err){
    statusEl.innerHTML = `❌ Terjadi kesalahan: ${err.message}`;
  }
});
</script>

</body>
</html>
