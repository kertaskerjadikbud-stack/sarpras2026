<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Data Sekolah</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f0f4f8;
    }
    .form-container {
      background: #ffffff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      max-width: 700px;
      margin: 2rem auto;
    }
    h2 {
      font-weight: 700;
      margin-bottom: 1rem;
      color: #1e3a8a;
    }
    .btn-submit {
      background-color: #1e3a8a;
      color: #fff;
    }
    .btn-submit:hover {
      background-color: #3b82f6;
      color: #fff;
    }
  </style>
</head>
<body class="font-sans">

<div class="form-container shadow-lg">
  <h2 class="text-center">Form Input Data Sekolah</h2>
  
  <!-- NPSN -->
  <div class="mb-3">
    <label for="npsn" class="form-label">NPSN</label>
    <input type="text" id="npsn" class="form-control" placeholder="Masukkan NPSN" onchange="getSchoolData()">
  </div>

  <!-- Info Sekolah -->
  <div id="schoolInfo" class="mb-4 p-3 border rounded bg-gray-100 text-gray-700">
    <!-- Nama Sekolah, Alamat, Kecamatan akan muncul di sini -->
  </div>

  <!-- Data Tambahan -->
  <div class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Jumlah Siswa</label>
      <input type="number" id="jumlahSiswa" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Rombel</label>
      <input type="number" id="jumlahRombel" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Kebutuhan Kursi</label>
      <input type="number" id="jumlahKursi" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Kebutuhan Meja</label>
      <input type="number" id="jumlahMeja" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Meja Guru</label>
      <input type="number" id="jumlahMejaGuru" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Kursi Guru</label>
      <input type="number" id="jumlahKursiGuru" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Papan Informasi</label>
      <input type="number" id="jumlahPapan" class="form-control">
    </div>
    <div class="col-md-6">
      <label class="form-label">Jumlah Lemari Arsip</label>
      <input type="number" id="jumlahLemari" class="form-control">
    </div>
  </div>

  <!-- Dokumen Pendukung -->
  <div class="mb-3 mt-3">
    <label class="form-label">Dokumen Pendukung</label>
    <input type="file" id="dokumen" class="form-control">
  </div>

  <!-- Submit Button -->
  <div class="text-center">
    <button class="btn btn-submit btn-lg" onclick="submitData()">Submit</button>
  </div>
</div>

<!-- Script -->
<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxsbqqMMRGbNNo8dLnU8mcvI-zgAVFmxvMrU7odE62T3qD2h8d1wyvoDiKSKKx2rhv3-w/exec"; // Ganti dengan Web App URL

  function getSchoolData() {
    const npsn = document.getElementById('npsn').value;
    fetch(`${WEB_APP_URL}?action=getSchool&npsn=${npsn}`)
      .then(res => res.json())
      .then(data => {
        if(data.found){
          document.getElementById('schoolInfo').innerHTML = 
            `<strong>Nama Sekolah:</strong> ${data.nama}<br>` +
            `<strong>Alamat:</strong> ${data.alamat}<br>` +
            `<strong>Kecamatan:</strong> ${data.kecamatan}`;
        } else {
          document.getElementById('schoolInfo').innerHTML = "Data tidak ditemukan";
        }
      });
  }

  function submitData() {
    const npsn = document.getElementById('npsn').value;
    const formData = new FormData();
    formData.append("action", "submit");
    formData.append("npsn", npsn);
    formData.append("jumlahSiswa", document.getElementById('jumlahSiswa').value);
    formData.append("jumlahRombel", document.getElementById('jumlahRombel').value);
    formData.append("jumlahKursi", document.getElementById('jumlahKursi').value);
    formData.append("jumlahMeja", document.getElementById('jumlahMeja').value);
    formData.append("jumlahMejaGuru", document.getElementById('jumlahMejaGuru').value);
    formData.append("jumlahKursiGuru", document.getElementById('jumlahKursiGuru').value);
    formData.append("jumlahPapan", document.getElementById('jumlahPapan').value);
    formData.append("jumlahLemari", document.getElementById('jumlahLemari').value);
    formData.append("dokumen", document.getElementById('dokumen').files[0]);

    fetch(WEB_APP_URL, { method: "POST", body: formData })
      .then(res => res.text())
      .then(msg => alert(msg));
  }
</script>
</body>
</html>
