<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Input Data Sarpras</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen flex flex-col">

<header class="bg-[#0B2C4D] text-white p-3 text-center font-bold">
  DINAS PENDIDIKAN DAN KEBUDAYAAN KAB. DONGGALA
</header>

<main class="flex-1 p-4">

<!-- LOGIN -->
<div id="loginBox" class="max-w-md mx-auto bg-white p-4 rounded shadow">
  <h2 class="text-center font-bold mb-3">Login NPSN</h2>
  <input id="npsn" class="form-control mb-3" placeholder="Masukkan NPSN">
  <button onclick="login()" class="btn btn-primary w-full">Login</button>
</div>

<!-- FORM -->
<div id="formBox" class="hidden max-w-3xl mx-auto bg-white p-4 rounded shadow">
  <h2 class="font-bold mb-3">Data Kebutuhan Sarpras</h2>

  <input id="no" class="form-control mb-2" readonly>
  <input id="npsnView" class="form-control mb-2" readonly>
  <input id="namaSekolah" class="form-control mb-2" readonly>
  <input id="alamat" class="form-control mb-2" readonly>
  <input id="kecamatan" class="form-control mb-4" readonly>

  <form id="form">
    <input name="jumlahSiswa" class="form-control mb-2" placeholder="Jumlah Siswa" required>
    <input name="jumlahRombel" class="form-control mb-2" placeholder="Jumlah Rombel" required>
    <input name="kursi" class="form-control mb-2" placeholder="Kebutuhan Kursi">
    <input name="meja" class="form-control mb-2" placeholder="Kebutuhan Meja">
    <input name="mejaGuru" class="form-control mb-2" placeholder="Meja Guru">
    <input name="kursiGuru" class="form-control mb-2" placeholder="Kursi Guru">
    <input name="papan" class="form-control mb-2" placeholder="Papan Informasi">
    <input name="lemari" class="form-control mb-3" placeholder="Lemari Arsip">

    <input type="file" name="file" class="form-control mb-3">

    <button class="btn btn-success w-full">Simpan</button>
  </form>
</div>

</main>

<footer class="bg-[#0B2C4D] text-white text-center text-sm py-2">
  © 2026 Disdikbud Donggala
</footer>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz8vWBCFmqVu7bAsJkP2T_3DZoLtSo4H-KdfbSyfaHqhzX5ZCS9IbJ6LN2MSXD5I0y5/exec';
let sekolah = null;

function login() {
  const npsn = document.getElementById('npsn').value.trim();
  if (!npsn) return alert('NPSN wajib diisi');

  fetch(`${API_URL}?action=login&npsn=${npsn}`, { method: 'POST' })
    .then(r => r.json())
    .then(res => {
      if (res.status === 'ok') {
        sekolah = res.sekolah;
        loginBox.classList.add('hidden');
        formBox.classList.remove('hidden');

        no.value = sekolah.no;
        npsnView.value = sekolah.npsn;
        namaSekolah.value = sekolah.nama;
        alamat.value = sekolah.alamat;
        kecamatan.value = sekolah.kecamatan;

      } else {
        alert(res.message);
      }
    });
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();

  const fd = new FormData(e.target);
  const file = fd.get('file');

  let fileBase64='', fileName='', fileType='';
  if (file && file.size>0) {
    fileName = sekolah.npsn + '_' + file.name;
    fileType = file.type;
    fileBase64 = await toBase64(file);
  }

  const body = new URLSearchParams();
  body.append('action','submit');
  body.append('data',JSON.stringify({
    row: sekolah.row,
    jumlahSiswa: fd.get('jumlahSiswa'),
    jumlahRombel: fd.get('jumlahRombel'),
    kursi: fd.get('kursi'),
    meja: fd.get('meja'),
    mejaGuru: fd.get('mejaGuru'),
    kursiGuru: fd.get('kursiGuru'),
    papan: fd.get('papan'),
    lemari: fd.get('lemari'),
    fileBase64, fileName, fileType
  }));

  fetch(API_URL,{method:'POST',body})
    .then(r=>r.json())
    .then(res=>{
      alert(res.message);
      if(res.status==='ok'){
        form.reset();
        formBox.classList.add('hidden');
        loginBox.classList.remove('hidden');
        npsn.value='';
      }
    });
});

function toBase64(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result.split(',')[1]);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}
</script>

</body>
</html>
